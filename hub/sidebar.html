<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>prdone — Sidebar</title>
<style>
  :root{
    --bg:#0f1216;--panel:#171b21;--panel2:#1c222a;--line:#272e38;
    --ink:#e7ecf2;--dim:#93a0b2;--faint:#5f6b7c;
    --accent:#4ea3ff;--teal:#3ad0b0;--warn:#f5a35b;--bad:#ef6f6f;--ok:#5cc98a;--prd:#a98bff;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  *{scrollbar-width:none}                              /* invisible scrollbars everywhere */
  *::-webkit-scrollbar{width:0;height:0;display:none}
  html,body{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
  /* Full-bleed: fills the host panel/sidebar edge-to-edge (no floating card). */
  .sb{width:100%;height:100vh;background:var(--bg);border:none;border-radius:0;
      display:flex;flex-direction:column;overflow:hidden}
  .sb-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sb-head .wm{font:800 15px var(--sans);letter-spacing:-.02em}.sb-head .wm b{color:var(--prd)}
  .sb-head .repo{font:600 12px var(--mono);color:var(--repoColor,var(--accent));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-head .cnt{margin-left:auto;font:600 10px var(--mono);color:var(--faint);flex:0 0 auto}
  /* 1) tabs nav — on top */
  .tabs{display:flex;padding:6px 8px 0;gap:2px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .tb{flex:1;text-align:center;font:600 11.5px var(--sans);color:var(--dim);padding:8px 4px;cursor:pointer;
      border-bottom:2px solid transparent;display:flex;flex-direction:column;gap:2px}
  .tb:hover{color:var(--ink)}
  .tb.on{color:var(--ink);border-bottom-color:var(--repoColor,var(--accent))}
  .tb .c{font:700 10px var(--mono);color:var(--faint)}.tb.on .c{color:var(--repoColor,var(--accent))}
  /* 2) expandable chips — underneath the tabs. collapsed = one row; expands into a slide-down drawer */
  .chips-zone{position:relative;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .chips-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;overflow:hidden}
  .chips-bar .expander{margin-left:auto;flex:0 0 auto;font:600 10.5px var(--mono);color:var(--dim);cursor:pointer;
      border:1px solid var(--line);border-radius:14px;padding:4px 9px;white-space:nowrap;display:flex;gap:5px;align-items:center}
  .chips-bar .expander:hover{color:var(--ink);border-color:var(--faint)}
  .chips-bar .expander .car{transition:transform .18s}
  .chips-zone.open .expander .car{transform:rotate(180deg)}
  .chips-drawer{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel);
      border-bottom:1px solid var(--line);box-shadow:0 16px 34px rgba(0,0,0,.55);
      display:flex;flex-wrap:wrap;gap:6px;padding:0 12px;max-height:0;overflow:hidden;
      transition:max-height .22s ease,padding .2s ease}
  .chips-zone.open .chips-drawer{max-height:62vh;overflow-y:auto;overflow-x:hidden;padding:12px}
  .rchip{font:600 11.5px var(--sans);padding:5px 10px 5px 8px;border-radius:20px;border:1px solid var(--line);
         color:var(--dim);background:var(--panel);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;max-width:100%}
  .rchip .lbl{overflow:hidden;text-overflow:ellipsis}
  .rchip .dot{width:8px;height:8px;border-radius:50%;background:var(--rc,var(--faint));flex:0 0 auto}
  .rchip:hover{color:var(--ink);border-color:var(--rc,var(--faint))}
  .rchip.on{color:var(--ink);border-color:var(--rc,var(--accent));background:color-mix(in srgb,var(--rc,var(--accent)) 22%,transparent)}
  .rchip .n{font:600 9px var(--mono);color:var(--faint)}
  /* 3) per-tab list + selection highlight bar (active repo color) */
  .list{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px}
  .tile{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid transparent;
        border-radius:7px;padding:9px 11px 9px 12px;margin-bottom:7px;cursor:pointer;transition:background .1s,border-color .1s}
  .tile:hover{background:var(--panel2)}
  .tile.sel{border-left-color:var(--repoColor,var(--accent));background:var(--panel2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--repoColor,var(--accent)) 45%,transparent)}
  .tile .top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .glyph{font:700 9px var(--mono);letter-spacing:.4px;padding:1px 6px;border-radius:4px;text-transform:uppercase}
  .g-scratch{background:#241d3a;color:var(--prd)}.g-archive{background:#1c2836;color:var(--accent)}.g-library{background:#16302a;color:var(--teal)}
  .g-num{color:var(--accent);font:700 11px var(--mono)}
  .g-age{margin-left:auto;font:10px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  .tile .ttl{font:600 12.5px var(--sans);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .sub{font:10.5px var(--mono);color:var(--faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .lnk{display:inline-block;margin-top:5px;font:600 9.5px var(--mono);color:var(--prd);border:1px solid #3a3255;border-radius:10px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .lnk.none{color:var(--faint);border-color:var(--line);border-style:dashed}
  .work{font:11px var(--mono);color:var(--dim);padding:2px 2px;word-break:break-word}
  .work b{color:var(--warn)}
  .conn-label{font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:12px 4px 5px}
  .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .empty{color:var(--faint);text-align:center;padding:32px 12px;font-size:12px;line-height:1.6}.empty .big{font-size:24px;opacity:.4}
  .loading{color:var(--dim);text-align:center;padding:40px;font:12px var(--mono)}
  /* cross-tab search */
  .sb-searchrow{flex:0 0 auto;padding:8px 10px;border-bottom:1px solid var(--line)}
  .sb-search{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:600 12px var(--sans)}
  .sb-search:focus{outline:none;border-color:var(--accent)}
  .ghd{font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:10px 4px 5px}
  .rglyph{font:700 8.5px var(--mono);letter-spacing:.4px;padding:1px 5px;border-radius:4px;text-transform:uppercase}
  .rglyph.prd{background:#241d3a;color:var(--prd)}.rglyph.handoff{background:#16302a;color:var(--teal)}.rglyph.issue{background:#1c2836;color:var(--accent)}
  .rsnip{font:10px var(--mono);color:var(--faint);margin-top:4px;word-break:break-word}.rsnip b{color:var(--warn)}
</style></head>
<body>
<div class="sb">
  <div class="sb-head"><span class="wm"><b>prdone</b></span><span class="repo" id="repoName"></span><span class="cnt" id="cnt"></span></div>
  <div class="sb-searchrow"><input id="q" class="sb-search" placeholder="⌕ search PRDs + handoffs + issues…" autocomplete="off" spellcheck="false"></div>
  <div class="tabs" id="tabs"></div>
  <div class="chips-zone" id="chipsZone">
    <div class="chips-bar" id="chipsBar"></div>
    <div class="chips-drawer" id="chipsDrawer"></div>
  </div>
  <div class="list" id="list"><div class="loading">loading…</div></div>
</div>
<script>
let DATA=null, REPO=(window.__HUB_REPO__||'twicedata_intra'), TAB='PRDs', REPOS=[];
let SEARCHING=false, qTimer=null, ALL_ISSUES=null;
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hi=(text,q)=>{const e=esc(text);try{const rx=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return e.replace(rx,'<b>$1</b>');}catch(_){return e;}};
// ── Cross-tab search: PRD + handoff file content AND issue titles, all repos ──
async function ensureIssues(){
  if(ALL_ISSUES) return ALL_ISSUES;
  try{ const j=await (await fetch('/api/hub?repo='+encodeURIComponent('(all-issues)'))).json(); ALL_ISSUES=(j&&j.issues)||[]; }catch(_){ ALL_ISSUES=[]; }
  return ALL_ISSUES;
}
function bindSearch(){
  const q=document.getElementById('q');
  q.addEventListener('input',()=>{clearTimeout(qTimer);const v=q.value.trim();qTimer=setTimeout(()=>{v?doSearch(v):exitSearch();},220);});
  q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';exitSearch();}});
}
const filterIssues=(list,v)=>{const lc=v.toLowerCase();return list.filter(i=>String(i.title||'').toLowerCase().includes(lc)||('#'+i.number)===v);};
async function doSearch(v){
  SEARCHING=true;
  const L=document.getElementById('list'); L.innerHTML='<div class="loading">searching “'+esc(v)+'”…</div>';
  let res; try{res=await (await fetch('/api/search?q='+encodeURIComponent(v))).json();}catch(e){L.innerHTML='<div class="empty">search failed</div>';return;}
  if(!SEARCHING) return;
  const files=(res&&res.results)||[];
  renderSearch(v,files, ALL_ISSUES?filterIssues(ALL_ISSUES,v):null);
  if(!ALL_ISSUES){
    const all=await ensureIssues();
    if(!SEARCHING || document.getElementById('q').value.trim()!==v) return;
    renderSearch(v,files,filterIssues(all,v));
  }
}
function exitSearch(){SEARCHING=false;renderList();}
function renderSearch(q,results,issues){
  const pending=(issues===null||issues===undefined);
  issues=issues||[];
  const L=document.getElementById('list'); L.innerHTML='';
  if(!results.length && !issues.length && !pending){L.appendChild(el('div','empty','<div class="big">⌕</div>no matches for “'+esc(q)+'”'));return;}
  const groups={prd:[],handoff:[],other:[]};
  results.forEach(r=>(groups[r.type]||groups.other).push(r));
  if(pending){ L.appendChild(el('div','ghd','Issues · connecting to repos…')); }
  if(issues.length){
    L.appendChild(el('div','ghd','Issues · '+issues.length));
    issues.forEach(i=>{const n=el('div','tile',`<div class="top"><span class="rglyph issue">issue</span><span class="g-num">#${esc(i.number)}</span><span class="g-age">${esc(i.repo||'')}</span></div><div class="ttl">${hi(i.title||'',q)}</div>`);n.onclick=()=>act({type:'HUB_ITEM_ACTION',kind:'issue',url:i.url,number:i.number});L.appendChild(n);});
  }
  [['prd','PRDs'],['handoff','Handoffs'],['other','Other']].forEach(([k,label])=>{
    const arr=groups[k]; if(!arr.length) return;
    L.appendChild(el('div','ghd',label+' · '+arr.length));
    arr.forEach(r=>{const base=String(r.path||'').split('/').pop();
      const snips=(r.matches||[]).map(m=>`<div class="rsnip">${hi(m.text||'',q)}</div>`).join('');
      const n=el('div','tile',`<div class="top"><span class="rglyph ${esc(k)}">${esc(k)}</span><span class="g-age" style="max-width:40%">${r.count} hit${r.count!==1?'s':''}</span></div><div class="sub" style="white-space:normal">${esc(base)}</div>${snips}`);
      n.onclick=()=>act({type:'HUB_ITEM_ACTION',kind:k,file:base,path:r.path});L.appendChild(n);});
  });
}
// Native-webview action bridge (set by the extension shim); no-op when served standalone.
const act=(m)=>{if(window.__prdAction)window.__prdAction(m);};
const PALETTE=['#4ea3ff','#a98bff','#3ad0b0','#f5a35b','#ef6f6f','#5cc98a','#e6c15a','#e87fb0','#7dd3fc','#c084fc','#fb923c','#4ade80','#f472b6','#38bdf8','#a3e635','#fbbf24'];
const repoColor=n=>{let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length];};
const setRepoColor=()=>document.querySelector('.sb').style.setProperty('--repoColor',repoColor(REPO));
const mkChip=(r,active)=>{const n=(r.prdCount||0)+(r.giteaOpenIssues||0);
  const chip=el('div','rchip'+(active?' on':''),`<span class="dot"></span><span class="lbl">${esc(r.name)}</span>${n?`<span class="n">${n}</span>`:''}`);
  chip.style.setProperty('--rc',repoColor(r.name));
  chip.onclick=()=>{REPO=r.name;setRepoColor();document.getElementById('chipsZone').classList.remove('open');renderBar();load();};
  return chip;};

async function loadChips(){
  const d=await (await fetch('/api/repos')).json();
  REPOS=d.repos;
  document.getElementById('cnt').textContent=d.shown+' repos';
  renderBar(); renderDrawer();
}
function renderBar(){
  const bar=document.getElementById('chipsBar'); bar.innerHTML='';
  const cur=REPOS.find(r=>r.name===REPO)||{name:REPO};
  bar.appendChild(mkChip(cur,true));
  const exp=el('div','expander',`${REPOS.length} repos <span class="car">▾</span>`);
  exp.onclick=()=>document.getElementById('chipsZone').classList.toggle('open');
  bar.appendChild(exp);
  document.getElementById('repoName').textContent=REPO;
}
function renderDrawer(){
  const dr=document.getElementById('chipsDrawer'); dr.innerHTML='';
  REPOS.forEach(r=>dr.appendChild(mkChip(r,r.name===REPO)));
}
async function load(){
  const qi=document.getElementById('q'); if(qi) qi.value=''; SEARCHING=false;
  document.getElementById('list').innerHTML='<div class="loading">loading '+esc(REPO)+'…</div>';
  DATA=await (await fetch('/api/hub?repo='+encodeURIComponent(REPO))).json();
  renderTabs(); renderList();
}
function counts(){const d=DATA||{};const cn=d.connections||{uses:[],usedBy:[],references:[]};
  return {Work:(d.work&&d.work.dirty)||0,PRDs:(d.prds||[]).length,Issues:(d.issues||[]).length,Handoffs:(d.handoffs||[]).length,
          Links:(cn.uses.length+cn.usedBy.length+cn.references.length)};}
function renderTabs(){
  const c=counts(); const t=document.getElementById('tabs'); t.innerHTML='';
  ['Work','PRDs','Issues','Handoffs','Links'].forEach(name=>{
    const tb=el('div','tb'+(name===TAB?' on':''),`${name}<span class="c">${c[name]}</span>`);
    tb.onclick=()=>{TAB=name;document.querySelectorAll('.tb').forEach(x=>x.classList.remove('on'));tb.classList.add('on');renderList();};
    t.appendChild(tb);
  });
}
function renderList(){
  SEARCHING=false;
  const d=DATA||{}, L=document.getElementById('list'); L.innerHTML='';
  const sel=n=>{n.onclick=()=>{document.querySelectorAll('.tile').forEach(x=>x.classList.remove('sel'));n.classList.add('sel');};};
  // Like sel(), but also fires an item action (open/copy/manage) to the extension.
  const bind=(n,m)=>{n.onclick=()=>{document.querySelectorAll('.tile').forEach(x=>x.classList.remove('sel'));n.classList.add('sel');act(m);};};
  if(TAB==='Work'){
    const w=d.work||{};
    L.appendChild(el('div','work',`branch <b>${esc(w.branch||'?')}</b> · ${w.worktrees||0} worktree(s) · ${w.dirty||0} dirty`));
    (w.recent||[]).forEach(c=>{const n=el('div','tile',`<div class="sub" style="white-space:normal">${esc(c)}</div>`);sel(n);L.appendChild(n);});
    if(!(w.recent||[]).length)L.appendChild(el('div','empty','<div class="big">◴</div>no recent commits'));
  } else if(TAB==='PRDs'){
    const byPrd=(d.links&&d.links.byPrd)||{};
    (d.prds||[]).forEach(p=>{const cnt=(byPrd[p.id]||[]).length;const n=el('div','tile',
      `<div class="top"><span class="glyph g-${esc(p.tier)}">${esc(p.tier)}</span><span class="g-age">${cnt} issue${cnt!==1?'s':''}</span></div>
       <div class="ttl">${esc(p.title||p.id)}</div><div class="sub">${esc(p.id)}</div>`);bind(n,{type:'HUB_ITEM_ACTION',kind:'prd',id:p.id,tier:p.tier,status:p.status});L.appendChild(n);});
    if(!(d.prds||[]).length)L.appendChild(el('div','empty','<div class="big">▤</div>no PRDs for this repo'));
  } else if(TAB==='Issues'){
    const tById={};(d.prds||[]).forEach(p=>tById[p.id]=p.title||p.id);
    (d.issues||[]).forEach(i=>{const refs=(i.prdRefs||[]);
      const link=refs.length?`<span class="lnk">↑ ${esc((tById[refs[0]]||refs[0]).slice(0,26))}</span>`:`<span class="lnk none">no PRD</span>`;
      const n=el('div','tile',`<div class="top"><span class="g-num">#${i.number}</span><span class="g-age">${esc((i.labels||[]).join(' '))}</span></div>
       <div class="ttl">${esc(i.title||'')}</div>${link}`);bind(n,{type:'HUB_ITEM_ACTION',kind:'issue',url:i.url,number:i.number});L.appendChild(n);});
    if(!(d.issues||[]).length)L.appendChild(el('div','empty','<div class="big">✓</div>no open issues'));
  } else if(TAB==='Handoffs'){
    (d.handoffs||[]).forEach(h=>{const n=el('div','tile',`<div class="sub" style="white-space:normal">⇲ ${esc(h.file)}</div>`);bind(n,{type:'HUB_ITEM_ACTION',kind:'handoff',file:h.file});L.appendChild(n);});
    if(!(d.handoffs||[]).length)L.appendChild(el('div','empty','<div class="big">⇲</div>no handoffs linked<br><span style="font:10px var(--mono);color:var(--faint)">/handoff → ~/handoff/</span>'));
  } else {
    const c=d.connections||{uses:[],usedBy:[],references:[]};
    const grp=(label,arr,arrow)=>{ if(!arr.length)return;
      L.appendChild(el('div','conn-label',label));
      arr.forEach(rn=>{const n=el('div','tile',`<div class="top"><span class="cdot" style="background:${repoColor(rn)}"></span><span class="ttl" style="-webkit-line-clamp:1">${arrow} ${esc(rn)}</span></div>`);
        n.onclick=()=>{REPO=rn;setRepoColor();renderBar();load();};L.appendChild(n);});
    };
    grp('Uses →',c.uses,'→'); grp('Used by ←',c.usedBy,'←'); grp('References',c.references,'·');
    if(!c.uses.length&&!c.usedBy.length&&!c.references.length)L.appendChild(el('div','empty','<div class="big">⇄</div>no detected connections'));
  }
}
(async()=>{bindSearch();const q=new URLSearchParams(location.search);if(q.get('repo'))REPO=q.get('repo');if(q.get('tab'))TAB=q.get('tab');setRepoColor();await loadChips();await load();})();
</script>
</body></html>
